<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="blackTeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="garmentShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#garmentShadow)">
    <!-- T-Shirt Main Body & Sleeves -->
    <path d="M 120 40 
             C 160 65, 240 65, 280 40 
             L 370 110 
             L 320 185 
             L 285 160 
             L 285 410 
             L 115 410 
             L 115 160 
             L 80 185 
             L 30 110 Z" 
          fill="url(#blackTeeGrad)" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
    <!-- Collar Line -->
    <path d="M 140 45 C 170 85, 230 85, 260 45" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <!-- Shoulder & Seam Accents -->
    <path d="M 120 40 L 115 160 M 280 40 L 285 160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Fabric Texture Fold Lines -->
    <path d="M 160 180 C 180 220, 220 220, 240 180" fill="none" stroke="#1e293b" stroke-width="3" opacity="0.6"/>
    <path d="M 150 290 C 185 320, 215 320, 250 290" fill="none" stroke="#1e293b" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
