<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Fabric Shading Gradients -->
    <linearGradient id="blackCotton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="shoulderHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="realisticShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#realisticShadow)">
    <!-- Main Oversized Black Tee Contour -->
    <path d="M 125 42 
             C 160 65, 240 65, 275 42 
             L 375 112 
             L 325 190 
             L 288 165 
             L 288 440 
             L 112 440 
             L 112 165 
             L 75 190 
             L 25 112 Z" 
          fill="url(#blackCotton)" stroke="#090d16" stroke-width="2" stroke-linejoin="round"/>

    <!-- Shoulder Fabric Highlights & Oversized Drop-Shoulder Seams -->
    <path d="M 125 42 L 30 112 L 75 190 L 112 165 Z" fill="url(#shoulderHighlight)"/>
    <path d="M 275 42 L 375 112 L 325 190 L 288 165 Z" fill="url(#shoulderHighlight)"/>

    <!-- Ribbed Crewneck Collar -->
    <path d="M 140 45 C 170 85, 230 85, 260 45" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M 143 47 C 170 83, 230 83, 257 47" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- Drop-Shoulder Stitching Lines -->
    <line x1="95" y1="90" x2="115" y2="175" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="305" y1="90" x2="285" y2="175" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Realistic Cotton Fabric Fold Shadows -->
    <path d="M 140 180 C 175 220, 225 220, 260 180" fill="none" stroke="#020617" stroke-width="4" opacity="0.7"/>
    <path d="M 130 310 C 180 345, 220 345, 270 310" fill="none" stroke="#020617" stroke-width="5" opacity="0.6"/>
    <path d="M 150 390 C 185 410, 215 410, 250 390" fill="none" stroke="#020617" stroke-width="4" opacity="0.5"/>

    <!-- Bottom Hem Line -->
    <line x1="112" y1="434" x2="288" y2="434" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
