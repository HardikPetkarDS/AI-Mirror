<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Organic White Cotton Fabric Gradients & Shading -->
    <linearGradient id="whiteCotton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="whiteFoldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="realisticShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#realisticShadow)">
    <!-- Main Heavyweight White Tee Contour -->
    <path d="M 128 42 
             C 160 62, 240 62, 272 42 
             L 365 105 
             L 318 180 
             L 282 158 
             L 282 435 
             L 118 435 
             L 118 158 
             L 82 180 
             L 35 105 Z" 
          fill="url(#whiteCotton)" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Structured Sleeve Shading -->
    <path d="M 128 42 L 35 105 L 82 180 L 118 158 Z" fill="url(#whiteFoldShadow)"/>
    <path d="M 272 42 L 365 105 L 318 180 L 282 158 Z" fill="url(#whiteFoldShadow)"/>

    <!-- Ribbed Thick Collar -->
    <path d="M 142 46 C 170 82, 230 82, 258 46" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <path d="M 145 48 C 170 80, 230 80, 255 48" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Natural Fabric Weave Texture & Crease Folds -->
    <path d="M 145 170 C 180 205, 220 205, 255 170" fill="none" stroke="#cbd5e1" stroke-width="3" opacity="0.6"/>
    <path d="M 135 285 C 185 315, 215 315, 265 285" fill="none" stroke="#cbd5e1" stroke-width="4" opacity="0.5"/>
    <path d="M 150 375 C 185 395, 215 395, 250 375" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>

    <!-- Double Stitch Hem -->
    <line x1="118" y1="428" x2="282" y2="428" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
